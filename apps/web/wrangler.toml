# xcp.fun launchpad — Next.js on OpenNext, same worker pattern as xcp-explorer/exchange.
# Full-site cutover to xcp.fun happens at launch; until then workers.dev preview.
# The metadata paths are routed on the zone NOW: on-chain descriptions bake
# https://xcp.fun/j/<ASSET>.json (write-once), so those URLs must resolve the
# moment the first real launch confirms — LAUNCHCOIN's 404 was this gap.
name = "launchpad"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# NOTE: the xcp.fun zone lives in a DIFFERENT Cloudflare account than this
# worker, so routes cannot attach from here (error 10083). Until the account
# question is settled, the zone-side fix is a tiny proxy worker in the
# zone-owning account routed at {www.,}xcp.fun/j/* and /i/*, forwarding to
# https://launchpad.me-bbe.workers.dev with the same path.

# Workers Logs. apps/api has had this on since it was written; this worker
# never did, which is why its p99 (1.3s wall) could be described but not
# explained — there was no per-route timing to look at, only account-wide
# quantiles. CPU is the one meter that scales with visitors, so the worker
# serving them is the one that most needs to be legible when a launch brings
# ten times the traffic.
#
# head_sampling_rate is explicit rather than defaulted: at ~79k requests a day
# full sampling is far inside the included allowance, but a surge is exactly
# when logs multiply and exactly when they are worth having. If volume ever
# becomes the problem, turn this down — do not turn observability off.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Hosted token metadata: enhanced-asset-info JSON at /j/<ASSET>.json and the
# uploaded image at /i/<ASSET>. Write-once — descriptions lock on-chain, so
# what they point at must not drift.
[[r2_buckets]]
binding = "METADATA"
bucket_name = "launchpad-metadata"

# The API owns this index; the web worker only updates the creator-description
# mirror after an owner-authorized metadata edit. Reads still go through the
# cached public API.
[[d1_databases]]
binding = "DB"
database_name = "launchpad-db"
database_id = "b93ee0d6-a291-4d80-9fac-1dd4dc0c3cbe"

# Next's data/route cache. The binding name is fixed by the adapter's
# r2-incremental-cache override; renaming it turns caching back off silently.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "launchpad-inc-cache"
# LIFECYCLE: objects expire after 30 days, set 2026-08-17 via
#   wrangler r2 bucket lifecycle add <bucket> expire-stale-isr "" --expire-days 30
# Recorded here because it is NOT in code and nothing else would reveal it.
# OpenNext only ever WRITES to this bucket -- there is no eviction, so one
# object accumulates per unique URL rendered, forever. xcpdex-inc-cache reached
# 56,310 objects in its first day against a key space of 12,444 pairs and
# 248,029 assets. Expiry is safe: a missing entry is a cache miss, so the next
# request re-renders and re-caches it.
