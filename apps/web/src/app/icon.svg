<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The wordmark's emoji, drawn as text so the favicon is a few hundred
       bytes of static markup rather than a build-time raster. The glyph comes
       from the viewer's own emoji font, which is why it needs no embedding. -->
  <text x="50%" y="50%" font-size="54" text-anchor="middle" dominant-baseline="central">🎉</text>
</svg>
